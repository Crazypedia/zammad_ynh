# YunoHost NGINX config for Zammad (subdomain only)
# Assumes Zammad's puma listens on 127.0.0.1:3000 and websocket on 127.0.0.1:6042

# Upstreams are defined inline to avoid global scope collisions
upstream zammad_ynh_railsserver {
  server 127.0.0.1:3000;
}
upstream zammad_ynh_websocket {
  server 127.0.0.1:6042;
}

location ~ ^/(assets/|robots.txt|humans.txt|favicon.ico|apple-touch-icon.png) {
  expires max;
}

# legacy websocket endpoint
location ^~ /ws {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 86400;
  proxy_pass http://zammad_ynh_websocket;
}

# Rails ActionCable
location ^~ /cable {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 86400;
  proxy_pass http://zammad_ynh_railsserver;
}

# Main app
location / {
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Change this line when adding SSO integration
  proxy_set_header X-Forwarded-User "";

  proxy_read_timeout 300;
  proxy_pass http://zammad_ynh_railsserver;

  gzip on;
  gzip_types text/plain text/xml text/css image/svg+xml application/javascript application/x-javascript application/json application_xml;
  gzip_proxied any;
}
